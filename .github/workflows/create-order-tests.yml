name: Create order Edge Function tests

on:
  pull_request:
    paths:
      - "supabase/functions/create-order/**"
      - ".github/workflows/create-order-tests.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/functions/create-order/**"
      - ".github/workflows/create-order-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run isolated create-order tests
        run: deno test --allow-env supabase/functions/create-order/index_test.ts
